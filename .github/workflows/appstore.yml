name: App Store

# The whole pipeline, on a rented Mac.
#
# Nothing here needs a Mac in anyone's hands. GitHub provides the macOS runner,
# the App Store Connect API key does the authenticating, and Xcode mints its own
# signing certificate on the fly. The repo is authored on Windows and never
# opened in Xcode by a human.

on:
  # Deliberately manual. An automatic submit on every push to main is how you
  # end up sending Apple four builds in an afternoon.
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        required: true
        default: dry_run
        type: choice
        options:
          - compile       # build only, ~2 min, no simulator boot
          - screenshots   # capture only, download them as an artifact
          - dry_run       # build and upload everything, do not submit
          - release       # build, upload and submit for review

jobs:
  ship:
    # macos-15 or newer carries Xcode 26, which Apple has required for all new
    # submissions since 28 April 2026. Pinned rather than left on latest so a
    # runner image change cannot silently drop us onto an SDK Apple rejects.
    runs-on: macos-15
    timeout-minutes: 90

    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      # Fastlane writes far more usefully when it knows it is not a terminal.
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          # Pick the newest Xcode 26.x that is actually usable.
          #
          # Not hardcoded: the runner image carries /Applications/Xcode_26.app,
          # but it is a stub with no Contents/Developer inside, so selecting it
          # fails with "invalid developer directory" while `ls` happily lists
          # it. The real installs are the point releases. Checking for the
          # Developer directory is the only reliable test, and picking the
          # newest means a runner image update cannot strand us on an SDK
          # Apple has stopped accepting.
          chosen=""
          for app in $(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -Vr); do
            if [ -d "$app/Contents/Developer" ]; then chosen="$app"; break; fi
          done
          if [ -z "$chosen" ]; then
            echo "no usable Xcode 26 on this runner:"; ls /Applications | grep -i xcode
            exit 1
          fi
          echo "using $chosen"
          sudo xcode-select -s "$chosen/Contents/Developer"
          xcodebuild -version

      - name: Show available simulators
        run: |
          # So a wrong device name in Snapfile is a readable log line rather
          # than an opaque "destination not found".
          xcrun simctl list devicetypes | grep -E 'iPhone|iPad' | tail -25

      - name: Install xcodegen and fastlane
        run: |
          brew install xcodegen
          gem install fastlane --no-document

      # SnapshotHelper.swift defines setupSnapshot() and snapshot(), which the
      # UI test calls. It ships with fastlane rather than being a package, so it
      # is fetched into the test target instead of committed and left to rot at
      # whatever version it was copied at.
      - name: Fetch fastlane's SnapshotHelper
        run: |
          # SnapshotHelper.swift defines setupSnapshot() and snapshot(), which
          # the UI test calls. It ships inside the fastlane gem rather than as a
          # package, so it is copied into the test target instead of committed
          # and left to rot at whatever version it was copied at.
          #
          # Resolved to exactly one path: the runner can have several fastlane
          # gem versions installed, and an unquoted glob then hands `cp` three
          # arguments, which fails with "is not a directory" rather than
          # anything about there being two matches.
          src=$(ls "$(gem environment gemdir)"/gems/fastlane-*/snapshot/lib/assets/SnapshotHelper.swift 2>/dev/null | sort -V | tail -1)
          if [ -z "$src" ]; then
            echo "SnapshotHelper.swift not found in the fastlane gem"
            find "$(gem environment gemdir)/gems" -name SnapshotHelper.swift | head
            exit 1
          fi
          echo "using $src"
          cp "$src" Tests/ScreenshotTests/SnapshotHelper.swift
          test -f Tests/ScreenshotTests/SnapshotHelper.swift

      - name: Generate the Xcode project
        run: xcodegen generate

      # Split out from the fastlane lanes so a compile error is reported as a
      # compile error, rather than as a screenshot lane that failed for reasons
      # you have to read four hundred lines of log to find.
      - name: Build for simulator (compile check)
        run: |
          # pipefail is load bearing. Without it the exit status of this
          # pipeline is xcpretty's, not xcodebuild's, so a build with hard
          # compile errors in it reported success and the failure only surfaced
          # ten minutes later inside the screenshot run.
          set -o pipefail
          xcodebuild build \
            -project ASCIIMotion.xcodeproj \
            -scheme ASCIIMotion \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || exit 1

      - name: Capture screenshots
        if: ${{ inputs.action != 'compile' }}
        run: fastlane screenshots

      - name: Upload screenshots as an artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: fastlane/screenshots/**/*.png
          if-no-files-found: warn

      - name: Build, upload and submit
        if: ${{ inputs.action == 'dry_run' || inputs.action == 'release' }}
        run: fastlane ${{ inputs.action }}

      - name: Keep the build log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            ~/Library/Logs/gym
            ~/Library/Logs/snapshot
            fastlane/report.xml
          if-no-files-found: ignore
