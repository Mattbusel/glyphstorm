name: App Store

# The whole pipeline, on a rented Mac.
#
# Nothing here needs a Mac in anyone's hands. GitHub provides the macOS runner,
# the App Store Connect API key does the authenticating, and Xcode mints its own
# signing certificate on the fly. The repo is authored on Windows and never
# opened in Xcode by a human.

on:
  # Deliberately manual. An automatic submit on every push to main is how you
  # end up sending Apple four builds in an afternoon.
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        required: true
        default: dry_run
        type: choice
        options:
          - compile       # build only, ~2 min, no simulator boot
          - screenshots   # capture only, download them as an artifact
          - review_video  # the whole app from the home screen, for App Review
          - dry_run       # build and upload everything, do not submit
          - release       # build, upload and submit for review

jobs:
  ship:
    # macos-15 or newer carries Xcode 26, which Apple has required for all new
    # submissions since 28 April 2026. Pinned rather than left on latest so a
    # runner image change cannot silently drop us onto an SDK Apple rejects.
    runs-on: macos-15
    timeout-minutes: 90

    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      # Fastlane writes far more usefully when it knows it is not a terminal.
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          # Pick the newest Xcode 26.x that is actually usable.
          #
          # Not hardcoded: the runner image carries /Applications/Xcode_26.app,
          # but it is a stub with no Contents/Developer inside, so selecting it
          # fails with "invalid developer directory" while `ls` happily lists
          # it. The real installs are the point releases. Checking for the
          # Developer directory is the only reliable test, and picking the
          # newest means a runner image update cannot strand us on an SDK
          # Apple has stopped accepting.
          chosen=""
          for app in $(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -Vr); do
            if [ -d "$app/Contents/Developer" ]; then chosen="$app"; break; fi
          done
          if [ -z "$chosen" ]; then
            echo "no usable Xcode 26 on this runner:"; ls /Applications | grep -i xcode
            exit 1
          fi
          echo "using $chosen"
          sudo xcode-select -s "$chosen/Contents/Developer"
          xcodebuild -version

      - name: Show available simulators
        run: |
          # So a wrong device name in Snapfile is a readable log line rather
          # than an opaque "destination not found".
          xcrun simctl list devicetypes | grep -E 'iPhone|iPad' | tail -25

      - name: Install xcodegen and fastlane
        run: |
          brew install xcodegen
          gem install fastlane --no-document

      # SnapshotHelper.swift defines setupSnapshot() and snapshot(), which the
      # UI test calls. It ships with fastlane rather than being a package, so it
      # is fetched into the test target instead of committed and left to rot at
      # whatever version it was copied at.
      - name: Fetch fastlane's SnapshotHelper
        run: |
          # SnapshotHelper.swift defines setupSnapshot() and snapshot(), which
          # the UI test calls. It ships inside the fastlane gem rather than as a
          # package, so it is copied into the test target instead of committed
          # and left to rot at whatever version it was copied at.
          #
          # Resolved to exactly one path: the runner can have several fastlane
          # gem versions installed, and an unquoted glob then hands `cp` three
          # arguments, which fails with "is not a directory" rather than
          # anything about there being two matches.
          src=$(ls "$(gem environment gemdir)"/gems/fastlane-*/snapshot/lib/assets/SnapshotHelper.swift 2>/dev/null | sort -V | tail -1)
          if [ -z "$src" ]; then
            echo "SnapshotHelper.swift not found in the fastlane gem"
            find "$(gem environment gemdir)/gems" -name SnapshotHelper.swift | head
            exit 1
          fi
          echo "using $src"
          cp "$src" Tests/ScreenshotTests/SnapshotHelper.swift
          test -f Tests/ScreenshotTests/SnapshotHelper.swift

      - name: Generate the Xcode project
        run: xcodegen generate

      # Split out from the fastlane lanes so a compile error is reported as a
      # compile error, rather than as a screenshot lane that failed for reasons
      # you have to read four hundred lines of log to find.
      - name: Build for simulator (compile check)
        run: |
          # pipefail is load bearing. Without it the exit status of this
          # pipeline is xcpretty's, not xcodebuild's, so a build with hard
          # compile errors in it reported success and the failure only surfaced
          # ten minutes later inside the screenshot run.
          set -o pipefail
          xcodebuild build \
            -project ASCIIMotion.xcodeproj \
            -scheme ASCIIMotion \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || exit 1

      # The definitive check that the shader shipped.
      #
      # A missing default.metallib does not fail the build: the app compiles,
      # links and launches, and only refuses to render once it is running. That
      # cost a full ten minute screenshot cycle to discover, so it is asserted
      # here in two seconds instead.
      - name: Verify the shader shipped
        run: |
          app=$(find ~/Library/Developer/Xcode/DerivedData -name "Glyphstorm.app"                  -path "*iphonesimulator*" 2>/dev/null | head -1)
          if [ -z "$app" ]; then echo "no built app found"; exit 1; fi
          echo "app bundle: $app"
          ls -1 "$app"
          if [ -f "$app/default.metallib" ]; then
            echo "OK: default.metallib present"
          else
            echo "FAIL: default.metallib missing, the shader was not compiled in"
            exit 1
          fi

      # Only the screenshots action captures. dry_run and release use the
      # committed images in fastlane/screenshots, so a signing retry does not
      # pay ten minutes to regenerate pictures nobody asked to change.
      - name: Capture screenshots
        if: ${{ inputs.action == 'screenshots' }}
        run: fastlane screenshots

      # The App Review recording. Compiled first and recorded only once the
      # test has sent the simulator to the home screen, so the video is the
      # app launching and the whole flow, with no build time in it.
      - name: Record the review video
        if: ${{ inputs.action == 'review_video' }}
        run: |
          set -o pipefail
          udid=$(xcrun simctl list devices available | grep "iPhone 17 Pro Max (" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "recording on $udid"
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time "9:41" --batteryState charged --batteryLevel 100 || true

          xcodebuild build-for-testing \
            -project ASCIIMotion.xcodeproj \
            -scheme ASCIIMotion \
            -destination "id=$udid" \
            CODE_SIGNING_ALLOWED=NO | xcpretty

          # One photo in the library for the picker. Unsplash licence.
          xcrun simctl addmedia "$udid" Tests/ReviewMedia/pug.jpg

          xcodebuild test-without-building \
            -project ASCIIMotion.xcodeproj \
            -scheme ASCIIMotion \
            -destination "id=$udid" \
            -only-testing:ASCIIMotionUITests/ScreenshotTests/testReviewRecording \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1 &
          test_pid=$!

          # Start once the test runner is up. The test sends the simulator home
          # and waits there, so the recording opens on the home screen.
          for i in $(seq 1 600); do
            xcrun simctl spawn "$udid" launchctl list 2>/dev/null | grep -q xctrunner && break
            sleep 0.5
          done
          sleep 4

          mkdir -p capture
          xcrun simctl io "$udid" recordVideo --codec h264 --force capture/review.mp4 &
          rec=$!

          status=0
          wait $test_pid || status=$?
          sleep 1
          kill -INT $rec 2>/dev/null || true
          wait $rec 2>/dev/null || true
          grep -E "Test Case|error|failed|passed" test.log | tail -20
          ls -la capture/
          exit $status

      - name: Upload the video
        if: ${{ always() && inputs.action == 'review_video' }}
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: capture/*.mp4
          if-no-files-found: warn

      - name: Upload screenshots as an artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: fastlane/screenshots/**/*.png
          if-no-files-found: warn

      # xcodebuild reads the signing key from a file path, not from an
      # environment variable, so the base64 secret is materialised here. Written
      # to RUNNER_TEMP, which is wiped when the job ends and is never inside the
      # checkout, so it cannot be committed by accident.
      - name: Write the signing key to disk
        if: ${{ inputs.action == 'dry_run' || inputs.action == 'release' }}
        run: |
          echo "$ASC_KEY_CONTENT" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          # Size only. Never the contents.
          echo "key written, $(wc -c < "$RUNNER_TEMP/AuthKey.p8") bytes"

      # Import the distribution identity. Created once by Store/signing.py with
      # a private key that is kept, so nothing is ever generated on a runner.
      - name: Import the signing certificate
        if: ${{ inputs.action == 'dry_run' || inputs.action == 'release' }}
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"

          echo "$DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain"             -P "$DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a GUI prompt that no one can answer
          # and the build hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign:             -s -k "" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$keychain"
          rm -f "$RUNNER_TEMP/dist.p12"

          echo "identities available:"
          security find-identity -v -p codesigning "$keychain"

      - name: Build, upload and submit
        if: ${{ inputs.action == 'dry_run' || inputs.action == 'release' }}
        run: fastlane ${{ inputs.action }}

      - name: Keep the build log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            ~/Library/Logs/gym
            ~/Library/Logs/snapshot
            fastlane/report.xml
          if-no-files-found: ignore
