## ASCII Motion — XcodeGen project spec.
##
## The .xcodeproj is generated from this file rather than committed, because a
## hand-edited pbxproj is the single most fragile file in an iOS repo and this
## project is authored on Windows where it cannot be opened, let alone checked.
## The macOS CI runner installs xcodegen and generates it before building.
##
##   brew install xcodegen && xcodegen generate

name: ASCIIMotion

options:
  bundleIdPrefix: com.mattbusel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Keep generated groups tidy and deterministic so two runs produce the
  # identical project and CI caching actually works.
  generateEmptyDirectories: false

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Automatic, driven by the App Store Connect API key on CI.
    #
    # `xcodebuild -allowProvisioningUpdates` plus an API key lets Xcode mint the
    # certificate and profile itself on a clean runner, which is what makes a
    # zero-Mac setup possible: nothing has to be exported from a developer's
    # keychain and checked into anything. The team id comes from the
    # DEVELOPMENT_TEAM environment variable that CI sets.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Apple requires new submissions to be built against the iOS 26 SDK as of
    # 28 April 2026. That is enforced by the toolchain on the runner, not here;
    # this only guarantees we do not accidentally pin an older one.
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  ASCIIMotion:
    type: application
    platform: iOS

    sources:
      - path: Sources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattbusel.asciimotion
        PRODUCT_NAME: Glyphstorm
        INFOPLIST_KEY_CFBundleDisplayName: Glyphstorm
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Portrait only. The editor is a single column of controls under a
        # preview; there is no landscape design and shipping a broken one is a
        # rejection waiting to happen.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # The app draws its own dark ground everywhere; the status bar has to
        # agree or the top of the screen flashes white on launch.
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        # Metal shaders are compiled from Sources/Engine/Shaders.metal into the
        # default library the renderer looks up by name.
        MTL_ENABLE_DEBUG_INFO: NO
        MTL_FAST_MATH: YES

    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Glyphstorm
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        # No custom cryptography anywhere in this app. Declared in the build so
        # the upload never parks in "Missing Compliance" waiting on a form.
        ITSAppUsesNonExemptEncryption: false
        # Deliberately absent, and worth recording why:
        #
        #   NSPhotoLibraryUsageDescription — not needed. The app uses SwiftUI's
        #   PhotosPicker, which runs out of process and hands back only the
        #   items the user chose, so there is no library authorization to ask
        #   for and no permission prompt at all.
        #
        #   NSPhotoLibraryAddUsageDescription — not needed. Export goes through
        #   the share sheet rather than writing to the library directly.
        #
        #   NSCameraUsageDescription — not needed. There is no live camera in
        #   v1; you choose an existing photo or video.
        #
        # The result is an app that asks the user for nothing, which is both a
        # better first run and a much shorter privacy review.

  ASCIIMotionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/ScreenshotTests
    dependencies:
      - target: ASCIIMotion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattbusel.asciimotion.uitests
        TEST_TARGET_NAME: ASCIIMotion
        # A test bundle still has to be signed, and signing needs an Info.plist.
        # The app target has an explicit one; this target had neither an
        # explicit plist nor generation turned on, so every test run died with
        # "Cannot code sign because the target does not have an Info.plist file"
        # while the app itself compiled perfectly.
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ASCIIMotion:
    build:
      targets:
        ASCIIMotion: all
        ASCIIMotionUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - ASCIIMotionUITests
    archive:
      config: Release
